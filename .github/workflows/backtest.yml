name: Nifty Quant Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 1 * *'

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install git+https://github.com/NSEDownload/NSEDownload.git

      - name: Run backtest
        run: python -m scripts.backtest

      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nifty-quant-backtest-output
          path: output/
